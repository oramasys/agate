[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oramasys-agate"
version = "1.9.0"
description = "Hardware detection, selection, and model-fit authority for local LLM deployments"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agate"]

[tool.hatch.build.targets.wheel.force-include]
"src/agate/data/model_hardware_policy.yml" = "agate/data/model_hardware_policy.yml"
"src/agate/data/hardware_profiles.json" = "agate/data/hardware_profiles.json"
