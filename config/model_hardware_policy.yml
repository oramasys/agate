# oramasys/agate/config/model_hardware_policy.yml
# Canonical model-hardware affinity policy for the three proven fleet profiles
# (mac-studio, win-rtx3080, win-rtx5080 -- see src/agate/profiles.py).
#
# Converted from Perpetua-Tools/config/model_hardware_policy.yml's real,
# operational data (recalled and migrated, not invented) -- PT's binary
# mac_only/windows_only/shared lists mapped onto this schema's PREFER/
# ALLOW/NEVER verdicts. PT's own file remains the historical source of
# record for how these constraints were originally discovered; this file
# is the canonical, actively-maintained v2 policy going forward, per the
# ownership decision already recorded in PT's own memory (lesson
# lesson_legacy_5ca2112b2a5a: "v2 oramasys/agate repo will own
# model_hardware_policy.yml schema... perpetua-core imports agate").
#
# Known limitation, not silently worked around: this schema (v1) has only
# three verdict tiers (mac / windows / shared) -- it cannot yet express
# win-rtx3080 vs win-rtx5080 as separately-verdicted identities. Both
# resolve to the same "windows" tier today. Neither of the two Windows
# models below (the RTX-3080-noted reasoning model and the RTX-5080-noted
# Gemma model, per src/agate/profiles.py's notes) has been re-verified
# against the *other* Windows machine specifically -- a real open question
# for whoever finalizes a v2 schema with distinct Windows profile keys.

version: 1

metadata:
  owner: oramasys/agate
  last_updated: "2026-09-11"

models:
  # Mac-only: Apple Silicon MLX quantizations and Ollama-native ids with no
  # GGUF/CUDA equivalent on Windows. NEVER on windows or shared -- OOM,
  # missing CUDA kernel, or double-barrel GPU damage if a Win dispatch and
  # a Mac LM Studio mirror proxy the same model concurrently.
  qwen3.5:9b-nvfp4:
    mac: PREFER
    windows: NEVER
    shared: NEVER
    roles: [orchestration, inference]
    notes: >-
      Mac-native NVFP4 quantization. Migrated from PT's mac_only list.

  bge-m3:
    mac: PREFER
    windows: NEVER
    shared: NEVER
    roles: [embeddings]
    notes: >-
      1024-dim embeddings for gbrain/CRG. Migrated from PT's mac_only list.

  # Windows-only: models that physically require the RTX GGUF/offload path.
  # NEVER on mac -- confirmed too large for Mac unified memory (16 GB on
  # mac-studio; PT's own historical comment cited 24 GB, corrected against
  # the real RTX 3080 spec sheet during this migration -- see profiles.py).
  qwen3.5-27b-claude-4.6-opus-reasoning-distilled-v2:
    mac: NEVER
    windows: PREFER
    shared: NEVER
    context: 16384
    roles: [coder, checker, refiner, executor, verifier]
    notes: >-
      Heavy reasoning/coder lane, RTX 3080 GGUF offload. Migrated from PT's
      windows_only list. Not yet re-verified specifically against
      win-rtx5080's distinct VRAM profile.

  gemma-4-26b-a4b-it:
    mac: NEVER
    windows: PREFER
    shared: NEVER
    roles: [reasoning]
    notes: >-
      Large model, RTX GGUF. Migrated from PT's windows_only list. Named as
      win-rtx5080's own heavy reasoning lane in PT's config/devices.yml
      (as gemma-4-26b-a4b-it-nvfp4) -- the two records were not reconciled
      during this migration; do not assume they describe identical
      artifacts without checking PT's devices.yml directly.

  text-embedding-qwen3-embedding-8b-i1-gguf-q6-k:
    mac: NEVER
    windows: PREFER
    shared: NEVER
    roles: [embeddings]
    notes: >-
      4096-dim embeddings, Win LM Studio only. Migrated from PT's
      windows_only list.

  # Shared: confirmed to run natively on both machines, or small enough
  # that either handles it acceptably.
  qwen3.5-9b-mlx:
    mac: PREFER
    windows: ALLOW
    shared: PREFER
    roles: [fallback, lightweight-ops]
    notes: >-
      Native on Mac MLX; runs via proxy on Windows. Migrated from PT's
      shared list -- PT's own comment notes "native: Mac MLX | proxied:
      Win", hence PREFER on mac and ALLOW (not PREFER) on windows here.

  gemma-4-e4b-it:
    mac: PREFER
    windows: PREFER
    shared: PREFER
    roles: [fallback, lightweight-ops]
    notes: >-
      Confirmed native on both machines per PT's own comment. Migrated
      from PT's shared list.

routing:
  default: qwen3.5-9b-mlx
